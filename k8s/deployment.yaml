apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: PROJECT_NAME
              value: auth
            - name: PROJECT_VERSION
              value: v1
            - name: POSTGRES_DSN
              value: postgresql+asyncpg://postgres:postgres@postgresql.db.svc.cluster.local:5432/auth
            - name: REDIS_DSN
              value: redis://redis.db.svc.cluster.local:6379
            - name: EMAIL_SECRET_CODE
              value: ra1dkbpJGiphNLlHlbfstkTyoNvamAcIf-vq6dOzwoY=
            - name: ALGORITHM
              value: HS256
            - name: SECRET_KEY
              value: _ne5v1IzZ7lHd_OQjT0gDT84ZkjRly1XofLZOzRQ824=
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service.kafka.svc.cluster.local:9092

          readinessProbe:
            httpGet:
              path: /auth/api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /auth/api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
