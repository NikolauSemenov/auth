[project]
name = "auth"
version = "0.1.0"
description = ""
authors = [
    {name = "nikolausemenov",email = "semenov-ns@zvuk.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "marshmallow-dataclass (>=8.7.1,<9.0.0)",
    "apispec (>=6.9.0,<7.0.0)",
    "webargs (>=8.7.1,<9.0.0)",
    "aiohttp-apigami (>=0.5.7,<0.6.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "types-python-jose (>=3.5.0.20250531,<4.0.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "pytest-aiohttp (>=1.1.0,<2.0.0)",
    "faker (>=39.0.0,<40.0.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "redis (>=7.1.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
